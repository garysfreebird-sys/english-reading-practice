<title>Senior 1 English Practice 002 — Reading / Cloze / Grammar</title>
<style>
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#1f2430;
  --ink-2:#4b5364;
  --ink-3:#838c9e;
  --line:#e4e8f0;
  --brand:#3d5afe;
  --brand-soft:#eef1ff;
  --ok:#12a67a;
  --ok-soft:#e6f7f1;
  --warn:#e8891b;
  --shadow:0 1px 2px rgba(24,32,56,.04),0 8px 24px rgba(24,32,56,.06);
  --radius:14px;
  --pfs:17px;   /* passage font size  (adjustable) */
  --qfs:15px;   /* question font size (follows passage) */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);
}
.brand .title{font-size:17px;font-weight:700;letter-spacing:.2px}
.ver{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:800;
  background:var(--brand);color:#fff;letter-spacing:.5px;vertical-align:2px;
}
.brand .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.fields label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.fields input{
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;
  width:96px;color:var(--ink);background:#fbfcfe;outline:none;font-family:inherit;
}
.fields input:focus{border-color:var(--brand);background:#fff}
/* ---------- nav: tabs + marker tools + font size ---------- */
.nav{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:9px 22px;
  background:linear-gradient(#fbfcfe,#f4f6fb);border-bottom:1px solid var(--line);
}
.tabs{display:flex;gap:8px;overflow-x:auto;flex:1 1 auto;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:0}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap;
}
.tab:hover{border-color:#c9d2ff;color:var(--brand)}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(61,90,254,.28)}
.tab .num{
  font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--brand-soft);color:var(--brand);padding:0 5px;
}
.tab.active .num{background:rgba(255,255,255,.24);color:#fff}
.tab .rg{opacity:.6;font-weight:500;font-size:12px}
/* marker toolbar */
.marks,.size-ctl{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;padding-left:14px;
  border-left:1px solid var(--line);
}
.pw-wrap{display:flex;align-items:center;gap:5px;margin-left:4px;padding:3px 8px;border-radius:10px;background:#f2f5fc}
.pw-wrap .mk-label{margin-right:2px}
/* freehand pen colours: red / blue */
.pen-c{
  width:26px;height:26px;border-radius:8px;border:2px solid #fff;cursor:pointer;padding:0;
  box-shadow:0 0 0 1px var(--line);transition:.14s;position:relative;
}
.pen-c:hover{transform:translateY(-1px)}
.pen-c.on{box-shadow:0 0 0 2px var(--brand)}
.pen-c.on::after{
  content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  background:#fff;border-radius:50%;
}
.s-red{background:#e0523f}
.s-blue{background:#3d5afe}
.mk-label{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--ink-3);margin-right:2px}
.mk-ico{font-size:14px;line-height:1;margin-right:1px;filter:saturate(.85)}
.swatch{
  width:24px;height:24px;border-radius:7px;border:2px solid #fff;cursor:pointer;padding:0;
  box-shadow:0 0 0 1px var(--line);transition:.14s;
}
.swatch:hover{transform:translateY(-1px)}
.swatch.on{box-shadow:0 0 0 2px var(--brand)}
.s-y{background:#fff3a3}.s-g{background:#c9f3dd}.s-b{background:#cfe0ff}.s-p{background:#ffd3e2}
.tool-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;
  padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.14s;
  min-width:34px;
}
.tool-btn:hover{border-color:#c9d2ff;color:var(--brand)}
.tool-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tool-btn .u{font-size:14px}
.tool-btn.danger:hover{border-color:#ffc3bd;color:#e0523f;background:#fff6f5}
.fs-val{
  font-size:12px;font-weight:700;color:var(--ink-2);min-width:30px;text-align:center;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 4px;
}
.size-ctl .tool-btn{padding:4px 9px;font-size:12.5px}
/* pen thickness picker */
.pen-w{
  width:46px;height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:0 6px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;transition:.14s;
}
.pen-w:hover{border-color:#c9d2ff}
.pen-w i{display:block;width:26px;height:2px;background:var(--ink-2);border-radius:9px}
.pen-w b{font-size:9px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;line-height:1}
.pen-w.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(61,90,254,.18);background:#f4f6ff}
.pen-w.on i{background:var(--brand)}
.pen-w.on b{color:var(--brand)}
/* ---------- main ---------- */
.wrap{
  flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);
  gap:16px;padding:16px 22px 20px;
}
.pane{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.pane-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;
}
.pane-title{display:flex;align-items:baseline;gap:9px;min-width:0}
.pane-title h2{margin:0;font-size:14.5px;font-weight:700}
.pane-title .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.progress{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.bar{width:74px;height:5px;border-radius:99px;background:#eceff6;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .25s}
.mini-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;
  padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
}
.mini-btn:hover{border-color:#ffc3bd;color:#e0523f;background:#fff6f5}
.pane-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px 26px;scroll-behavior:smooth}
.pane-body::-webkit-scrollbar{width:9px}
.pane-body::-webkit-scrollbar-thumb{background:#d6dce8;border-radius:9px;border:2px solid #fff}
.pane-body::-webkit-scrollbar-thumb:hover{background:#bdc5d6}
/* ---------- left: passage ---------- */
.passage-wrap{position:relative;min-height:100%}
.passage{font-family:Georgia,Cambria,"Times New Roman",serif;font-size:var(--pfs);line-height:1.95;color:#22283a}
.passage .p-h{font-family:"Segoe UI",system-ui,sans-serif;font-size:calc(var(--pfs) + 2.5px);font-weight:700;line-height:1.4;margin:0 0 14px;color:#151a28}
.passage .p-sub{
  font-family:"Segoe UI",system-ui,sans-serif;font-size:calc(var(--pfs) - 2px);font-weight:700;letter-spacing:.4px;
  color:var(--brand);margin:20px 0 6px;
}
.passage p{margin:0 0 14px;text-align:justify}
.passage .li{margin:0 0 6px;padding-left:16px;text-indent:-16px}
.blank{
  display:inline-block;min-width:78px;padding:0 8px;margin:0 2px;border-radius:8px;
  border:1px dashed #b9c2ff;background:var(--brand-soft);color:var(--brand);
  font-weight:700;font-size:.9em;cursor:pointer;transition:.15s;text-align:center;
}
.blank:hover{background:#dfe4ff;border-style:solid}
.blank.filled{background:var(--ok-soft);border-color:#93d9c4;color:#0d8f68;border-style:solid}
/* in-text Chinese glosses kept from the source document */
.gloss{
  font-family:"Segoe UI",system-ui,sans-serif;font-size:.68em;font-weight:400;
  color:#9aa3b5;letter-spacing:0;padding:0 1px;
}
/* sentences (click one word -> whole sentence is marked) */
.sent{border-radius:4px;transition:background .15s,box-shadow .15s}
body.mark-on .sent:hover,body.mark-erase .sent:hover{background:rgba(61,90,254,.06);cursor:pointer}
/* highlight marks */
.mk{border-radius:3px;padding:1px 0;transition:.15s}
.mk-y{background:#fff3a3}
.mk-g{background:#c9f3dd}
.mk-b{background:#cfe0ff}
.mk-p{background:#ffd3e2}
.mk-u{text-decoration:underline;text-decoration-color:#ff8f3f;text-decoration-thickness:2px;text-underline-offset:2px}
body.mark-on .passage{cursor:crosshair}
body.mark-erase .passage{cursor:not-allowed}
.mk.eraseable:hover,.sent.eraseable:hover{outline:2px dashed #e0523f;outline-offset:1px}
/* freehand pen layer */
.ink-layer{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
body.pen-on .ink-layer{pointer-events:auto;cursor:crosshair}
body.pen-on .passage{cursor:crosshair}
body.pen-on .sent:hover{background:none}
.ink-layer polyline{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
/* invisible wide hit-area so a stroke is easy to click with the eraser */
.ink-layer .ink-hit{stroke:transparent;stroke-width:16;pointer-events:none}
body.mark-erase .ink-layer .ink-hit{pointer-events:stroke;cursor:not-allowed}
body.mark-erase .ink-layer .ink-g:hover .ink-line{stroke:#e0523f;stroke-opacity:.45}
.flash{animation:flash .9s ease}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px rgba(61,90,254,.22)}}
/* ---------- right: questions ---------- */
.q-head{
  font-size:calc(var(--qfs) - 2.5px);color:var(--ink-3);background:#f7f9fc;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.7;
}
.q-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff;transition:.18s}
.q-item.answered{border-color:#bfe6d8;background:#fbfefd}
.q-item.highlight{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,90,254,.14)}
.q-stem{display:flex;gap:8px;font-weight:600;font-size:var(--qfs);margin-bottom:9px;align-items:flex-start}
.q-stem.plain{margin-bottom:6px}
.q-no{
  flex:0 0 auto;background:var(--brand);color:#fff;border-radius:6px;font-size:calc(var(--qfs) - 3px);
  font-weight:700;padding:1px 7px;line-height:19px;margin-top:1px;
}
.q-item.answered .q-no{background:var(--ok)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:6px 8px}
.opt{
  display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border:1px solid var(--line);
  border-radius:9px;cursor:pointer;font-size:calc(var(--qfs) - 1px);color:var(--ink-2);background:#fff;transition:.14s;text-align:left;
  font-family:inherit;
}
.opts.inline .opt{padding:5px 10px;font-size:calc(var(--qfs) - 1.5px)}
.opt:hover{border-color:#bcc7f7;background:#f8f9ff}
.opt .k{
  flex:0 0 auto;width:19px;height:19px;border-radius:5px;background:#eef0f6;color:var(--ink-2);
  font-size:calc(var(--qfs) - 3.5px);font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);color:#2b3a9e;font-weight:600}
.opt.sel .k{background:var(--brand);color:#fff}
/* 7-option gap fill */
.pool{border:1px dashed #cfd6e6;border-radius:12px;padding:12px 14px;margin-bottom:14px;background:#fbfcfe}
.pool h4{margin:0 0 8px;font-size:12.5px;color:var(--ink-3);font-weight:700;letter-spacing:.3px}
.pool ol{list-style:none;margin:0;padding:0;font-size:calc(var(--qfs) - 1.5px);color:var(--ink-2);line-height:1.85}
.pool li{display:flex;gap:9px;padding:3px 0}
.pool .pk{
  flex:0 0 auto;width:24px;height:24px;margin-top:3px;border-radius:7px;background:var(--brand-soft);
  color:var(--brand);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid #d3dbff;
}
.blank-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.ltr{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;
  font-size:calc(var(--qfs) - 2px);font-weight:700;color:var(--ink-2);cursor:pointer;transition:.14s;font-family:inherit;
}
.ltr:hover{border-color:#bcc7f7;background:#f8f9ff}
.ltr.sel{background:var(--brand);border-color:var(--brand);color:#fff}
.picked{font-size:calc(var(--qfs) - 2px);color:var(--ok);margin-top:8px;font-weight:600}
/* grammar fill */
.fill-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fill-row input{
  border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:calc(var(--qfs) - 1px);width:170px;
  color:var(--ink);outline:none;font-family:inherit;background:#fbfcfe;
}
.fill-row input:focus{border-color:var(--brand);background:#fff}
.fill-hint{font-size:calc(var(--qfs) - 2.5px);color:var(--warn);background:#fff7ec;border-radius:6px;padding:2px 7px}
/* vocabulary */
details.vocab{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;overflow:hidden}
details.vocab summary{
  cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;justify-content:space-between;
}
details.vocab summary::-webkit-details-marker{display:none}
details.vocab summary::after{content:"Show ▾";font-size:12px;color:var(--ink-3);font-weight:600}
details.vocab[open] summary::after{content:"Hide ▴"}
.vocab-body{padding:0 14px 12px}
.v-row{display:flex;gap:12px;padding:7px 0;border-top:1px dashed #e6eaf2;font-size:calc(var(--qfs) - 1.5px)}
.v-row:first-child{border-top:none}
.v-w{flex:0 0 45%;font-weight:600;color:#22283a;font-family:Georgia,serif}
.v-w small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;font-family:"Segoe UI",sans-serif}
.v-m{flex:1;color:var(--ink-2)}
.tip{font-size:calc(var(--qfs) - 3px);color:var(--ink-3);margin-top:14px;text-align:center;line-height:1.8}
@media (max-width:1240px){
  .nav{flex-wrap:wrap}
  .marks,.size-ctl{border-left:none;padding-left:0}
}
@media (max-width:960px){
  body{overflow:auto}
  .wrap{grid-template-columns:1fr;height:auto}
  .pane-body{max-height:520px}
  .topbar{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-width:560px){ .fields input{width:78px} .wrap{padding:12px} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="title">Senior 1 English Practice 002 <span class="ver">v3</span></div>
    <div class="meta">Items 21–65 · Reading / 7-option Gap-fill / Cloze / Grammar</div>
  </div>
  <div class="fields">
    <label>Name<input id="f-name" placeholder=""></label>
    <label>Class<input id="f-class" placeholder=""></label>
    <label>Score<input id="f-score" placeholder=""></label>
  </div>
</header>

<nav class="nav">
  <div class="tabs" id="tabs"></div>
  <div class="marks">
    <span class="mk-ico" title="Highlighter">🖍</span>
    <button class="swatch s-y" data-tool="y" title="Highlight - yellow"></button>
    <button class="swatch s-g" data-tool="g" title="Highlight - green"></button>
    <button class="swatch s-b" data-tool="b" title="Highlight - blue"></button>
    <button class="swatch s-p" data-tool="p" title="Highlight - pink"></button>
    <button class="tool-btn" data-tool="u" title="Underline key information"><span class="u">▁</span></button>
    <span class="pw-wrap">
      <button class="tool-btn" data-tool="pen" title="Freehand pen - drag to draw, Esc to quit">✏️</button>
      <button class="pen-c s-red" data-pc="red" title="Red pen"></button>
      <button class="pen-c s-blue" data-pc="blue" title="Blue pen"></button>
      <button class="pen-w" data-w="2" title="Thin pen (2px)"><i style="height:2px"></i><b>2</b></button>
      <button class="pen-w" data-w="4" title="Medium pen (4px)"><i style="height:4px"></i><b>4</b></button>
      <button class="pen-w" data-w="8" title="Thick pen (8px)"><i style="height:8px"></i><b>8</b></button>
    </span>
    <button class="tool-btn" data-tool="off" title="Turn marking off">Off</button>
    <button class="tool-btn" data-tool="erase" title="Click a mark or a stroke to remove it">Erase</button>
    <button class="tool-btn danger" id="clear-marks" title="Remove every mark and stroke in this passage">Clear</button>
  </div>
  <div class="size-ctl">
    <span class="mk-label">SIZE</span>
    <button class="tool-btn" id="fs-down" title="Smaller text">A−</button>
    <span class="fs-val" id="fs-val">17</span>
    <button class="tool-btn" id="fs-up" title="Larger text">A+</button>
  </div>
</nav>

<main class="wrap">
  <section class="pane" id="pane-left">
    <div class="pane-head">
      <div class="pane-title"><h2 id="left-title">Passage</h2><span class="sub" id="left-sub"></span></div>
      <div class="pane-tools"><span class="progress" id="left-progress"></span></div>
    </div>
    <div class="pane-body">
      <div class="passage-wrap" id="passage-wrap">
        <div class="passage" id="passage"></div>
        <svg class="ink-layer" id="ink" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
  </section>

  <section class="pane" id="pane-right">
    <div class="pane-head">
      <div class="pane-title"><h2 id="right-title">Questions</h2><span class="sub" id="right-sub"></span></div>
      <div class="pane-tools">
        <span class="progress"><span id="pct">0/0</span><span class="bar"><i id="bar"></i></span></span>
        <button class="mini-btn" id="reset">Reset</button>
      </div>
    </div>
    <div class="pane-body" id="questions"></div>
  </section>
</main>

<script>
/* ===================== CONTENT ===================== */
const SECTIONS = [
{
  id:"a", tab:"A", no:"21-23",
  title:"Reading A", theme:"Job Advertisement",
  head:"Read the following passage and choose the best answer from A, B, C and D.",
  passage:[
    {t:"h", x:"Weekend Pot Wash Staff Wanted"},
    {t:"p", x:"We have a fantastic opportunity for a pot wash member of staff to join our team at The Evergreen Restaurant within Carpenders Park Garden Center in Watford. The ideal applicant must have a fantastic eye for detail and be able to work in a fast-paced（快节奏的）environment. As we are a busy restaurant, you must be prepared to work long hours and be able to stand the typical heat of the kitchen. This position offers convenient working hours — Saturday and Sunday, 11:00 a.m. – 4:00 p.m."},
    {t:"s", x:"Required Skills / Quality"},
    {t:"l", x:"Excellent organizational skills"},
    {t:"l", x:"High level of honesty"},
    {t:"l", x:"Working well as part of a team"},
    {t:"l", x:"Being passionate and self-motivated"},
    {t:"s", x:"Benefits"},
    {t:"l", x:"Free lunch on workdays"},
    {t:"l", x:"Free iced tea"},
    {t:"l", x:"Competitive pay"},
    {t:"l", x:"Free staff car parking"},
    {t:"s", x:"HOW TO APPLY"},
    {t:"p", x:"Please send a copy of your CV to info@carpenders.co.uk or hand it in, and note for the attention of the “HR Department”. Due to the high number of applications we receive, we regret that we cannot respond to everyone. If you do not hear from us within two weeks, please assume your application was unsuccessful this time. Please don’t call us."},
    {t:"p", x:"This is a fantastic opportunity to work in a fun and friendly environment. If you meet the above criteria, apply now!"}

/* ===================== STATE ===================== */
const KEY = "senior1-english-002";
const MKEY = KEY + ":marks2";     // passage HTML (highlight / underline / sentence marks)
const SKEY = KEY + ":ink2";       // freehand strokes
const FKEY = KEY + ":fontsize";
const WKEY = KEY + ":penwidth";
const PKEY = KEY + ":pencolor";
let answers = {};
try{ answers = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ answers = {}; }
let marks = {};
try{ marks = JSON.parse(localStorage.getItem(MKEY)) || {}; }catch(e){ marks = {}; }
let scribbles = {};
try{ scribbles = JSON.parse(localStorage.getItem(SKEY)) || {}; }catch(e){ scribbles = {}; }
let fs = parseInt(localStorage.getItem(FKEY) || "17", 10);
if(isNaN(fs) || fs<13 || fs>28) fs = 17;
const PEN_W = [2,4,8];
let penW = parseInt(localStorage.getItem(WKEY) || "4", 10);
if(PEN_W.indexOf(penW) < 0) penW = 4;
const PEN_INK = {red:"#e0523f", blue:"#3d5afe"};
let penC = localStorage.getItem(PKEY) || "red";
if(!PEN_INK[penC]) penC = "red";

let cur = SECTIONS[0].id;
const hash = location.hash.replace("#","");
if(hash && SECTIONS.some(s=>s.id===hash)) cur = hash;

let tool = "y";   // y g b p u | pen | off | erase
let lastColor = "y";

const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const curSec = () => SECTIONS.find(s=>s.id===cur);
const getAns = no => { const v = answers[no]; return (v===undefined||v=="")?null:v; };
function save(){ localStorage.setItem(KEY, JSON.stringify(answers)); }
function saveMarks(){ localStorage.setItem(MKEY, JSON.stringify(marks)); }
function saveInk(){ localStorage.setItem(SKEY, JSON.stringify(scribbles)); }

/* ===================== FONT SIZE ===================== */
function setFs(v){
  fs = Math.min(28, Math.max(13, v));
  document.documentElement.style.setProperty("--pfs", fs+"px");
  document.documentElement.style.setProperty("--qfs", (fs-2)+"px");
  $("fs-val").textContent = fs;
  localStorage.setItem(FKEY, fs);
  requestAnimationFrame(()=>{ resizeInk(); });
}
$("fs-up").onclick = () => setFs(fs+1);
$("fs-down").onclick = () => setFs(fs-1);

/* ===================== PEN: COLOUR + THICKNESS ===================== */
function setPenW(w){
  penW = w;
  localStorage.setItem(WKEY, w);
  document.querySelectorAll(".pen-w").forEach(b=> b.classList.toggle("on", +b.dataset.w === w));
}
function setPenC(c){
  penC = c;
  localStorage.setItem(PKEY, c);
  document.querySelectorAll(".pen-c").forEach(b=> b.classList.toggle("on", b.dataset.pc === c));
}
document.querySelectorAll(".pen-w").forEach(b=>{
  b.onclick = () => {
    setPenW(+b.dataset.w);
    if(tool !== "pen") setTool("pen");   // picking a thickness means "I want to draw"
  };
});
document.querySelectorAll(".pen-c").forEach(b=>{
  b.onclick = () => {
    setPenC(b.dataset.pc);
    if(tool !== "pen") setTool("pen");   // picking a pen colour means "I want to draw"
  };
});
setPenW(penW);
setPenC(penC);

/* ===================== RENDER ===================== */
function renderTabs(){
  $("tabs").innerHTML = SECTIONS.map((s,i)=>{
    const done = s.questions.filter(q=>getAns(q.no)!==null).length;
    const badge = done===s.questions.length ? "✓" : (done>0 ? done+"/"+s.questions.length : (i+1));
    return '<button class="tab'+(s.id===cur?" active":"")+'" data-id="'+s.id+'">'+
      '<span class="num">'+badge+'</span>'+s.tab+' <span class="rg">'+s.no+'</span></button>';
  }).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=> b.onclick = () => go(b.dataset.id));
}

/* keep the in-text glosses from the source, but style them quietly */
function inlineHTML(x){
  return x.replace(/（[^）]*）/g, m=>'<span class="gloss">'+m+'</span>')
          .replace(/\{\{(\d+)\}\}/g,
            (m,n)=>'<span class="blank" data-no="'+n+'">___'+n+'___</span>');
}

/* ---- split a paragraph into sentences (so one click marks a whole sentence) ---- */
const ABBR = ["a.m.","p.m.","Mr.","Mrs.","Ms.","Dr.","St.","No.","vs.","etc.","e.g.","i.e.","U.S.","U.K.","..."];
function splitSentences(text){
  let t = text, slots = [];
  ABBR.forEach((a,i)=>{
    while(t.indexOf(a)>=0){
      const ph = "\uE000" + String.fromCharCode(65+i) + "\uE001";
      slots.push([ph,a]);
      t = t.replace(a, ph);
    }
  });
  let parts = t.match(/[^.!?]+[.!?]+[\u201d\u2019"'\u201d)]{0,2}\s*|[^.!?]+$/g);
  if(!parts || !parts.length) parts = [t];
  return parts.map(p=>{
    slots.forEach(s=>{ p = p.split(s[0]).join(s[1]); });
    return p;
  }).filter(p=>p.trim()!=="");
}

function sentenceHTML(raw){
  return splitSentences(raw).map(s=>{
    const x = inlineHTML(esc(s));
    return '<span class="sent">'+x+'</span>';
  }).join("");
}

function buildPassageHTML(sec){
  let html = "";
  sec.passage.forEach(p=>{
    let x = inlineHTML(esc(p.x));
    if(p.t==="h") html += '<div class="p-h">'+x+'</div>';
    else if(p.t==="s") html += '<div class="p-sub">'+x+'</div>';
    else if(p.t==="l") html += '<p class="li">&bull;&nbsp; '+sentenceHTML(p.x)+'</p>';
    else html += '<p>'+sentenceHTML(p.x)+'</p>';
  });
  return html;
}

function renderPassage(sec){
  const box = $("passage");
  const saved = marks[sec.id];
  box.innerHTML = (saved && saved.indexOf('class="sent"')>=0) ? saved : buildPassageHTML(sec);
  bindBlanks();
  syncBlanks();
  requestAnimationFrame(()=>{ resizeInk(); drawInk(); });
}

function bindBlanks(){
  $("passage").querySelectorAll(".blank").forEach(b=>{
    b.onclick = () => { if(tool==="erase") return; jumpToQuestion(b.dataset.no); };
  });
}

function syncBlanks(){
  const sec = curSec();
  $("passage").querySelectorAll(".blank").forEach(b=>{
    const n = b.dataset.no, v = getAns(n);
    b.classList.toggle("filled", v!==null);
    if(v===null){ b.textContent = "___"+n+"___"; b.style.minWidth=""; return; }
    b.style.minWidth = "auto";
    if(sec.fill || sec.pool){ b.textContent = v; }
    else{
      const o = sec.questions.find(q=>String(q.no)===n);
      b.textContent = v + ". " + (o ? o.opts[v.charCodeAt(0)-65] : "");
    }
  });
}

function renderQuestions(sec){
  let html = '<div class="q-head">'+sec.head+'</div>';
  if(sec.pool){
    html += '<div class="pool"><h4>Options A–G (two are extra)</h4><ol>'+
      sec.options.map((o,i)=>'<li><span class="pk">'+(sec.letters[i]||String.fromCharCode(65+i))+
        '</span><span>'+esc(o)+'</span></li>').join("")+'</ol></div>';
  }
  sec.questions.forEach(q=>{
    const v = getAns(q.no);
    if(sec.fill){
      html += '<div class="q-item'+(v!==null?" answered":"")+'" data-q="'+q.no+'">'+
        '<div class="q-stem"><span class="q-no">'+q.no+'</span><span>Fill in ONE suitable word or the correct form</span></div>'+
        '<div class="fill-row"><input type="text" data-no="'+q.no+'" value="'+(v||"")+'" placeholder="Your answer..." autocomplete="off">'+
        '<span class="fill-hint">Cue '+esc(q.hint)+'</span></div></div>';
    }else if(sec.pool){
      html += '<div class="q-item'+(v!==null?" answered":"")+'" data-q="'+q.no+'">'+
        '<div class="blank-row"><span class="q-no">'+q.no+'</span><div class="letters">'+
        sec.letters.map(L=>'<button class="ltr'+(v===L?" sel":"")+'" data-no="'+q.no+'" data-v="'+L+'">'+L+'</button>').join("")+
        '</div></div>'+
        (v?'<div class="picked">Selected '+v+'. '+esc(sec.options[sec.letters.indexOf(v)])+'</div>':"")+
        '</div>';
    }else{
      const opts = sec.options ? sec.options : q.opts;
      html += '<div class="q-item'+(v!==null?" answered":"")+'" data-q="'+q.no+'">'+
        '<div class="q-stem'+(q.stem?"":" plain")+'"><span class="q-no">'+q.no+'</span>'+
        (q.stem?'<span>'+esc(q.stem)+'</span>':"")+'</div>'+
        '<div class="opts'+(sec.compact?" inline":"")+'">'+
        opts.map((o,i)=>{
          const L = String.fromCharCode(65+i);
          return '<button class="opt'+(v===L?" sel":"")+'" data-no="'+q.no+'" data-v="'+L+'">'+
            '<span class="k">'+L+'</span><span>'+esc(o)+'</span></button>';
        }).join("")+'</div></div>';
    }
  });
  const voc = VOCAB[sec.id] || [];
  if(voc.length){
    html += '<details class="vocab"><summary>Key vocabulary of this passage ('+voc.length+')</summary><div class="vocab-body">'+
      voc.map(v=>'<div class="v-row"><div class="v-w">'+esc(v[0])+'<small>'+esc(v[1])+'</small></div><div class="v-m">'+esc(v[2])+'</div></div>').join("")+
      '</div></details>';
  }
  html += '<div class="tip">Answers, highlights and pen strokes are saved automatically in this browser.<br>'+
          'Select text to highlight it &middot; click one word to mark the whole sentence &middot; '+
          'use &#9998; to draw freely (pick a red/blue pen and a thickness first, Esc to quit) &middot; press &larr; &rarr; to switch passages.</div>';
  $("questions").innerHTML = html;

  $("questions").querySelectorAll(".opt").forEach(b=>{
    b.onclick = () => { answers[b.dataset.no] = b.dataset.v; save(); refresh(); };
  });
  $("questions").querySelectorAll(".ltr").forEach(b=>{
    b.onclick = () => {
      const n = b.dataset.no;
      answers[n] = (answers[n]===b.dataset.v) ? "" : b.dataset.v;
      save(); refresh();
    };
  });
  $("questions").querySelectorAll('input[type="text"]').forEach(inp=>{
    inp.oninput = () => {
      answers[inp.dataset.no] = inp.value.trim(); save(); updateProgress(); syncBlanks();
      const item = $("questions").querySelector('.q-item[data-q="'+inp.dataset.no+'"]');
      if(item) item.classList.toggle("answered", inp.value.trim()!=="");
    };
  });
}

function updateProgress(){
  const sec = curSec();
  const done = sec.questions.filter(q=>getAns(q.no)!==null).length;
  const total = sec.questions.length;
  $("pct").textContent = done+"/"+total;
  $("bar").style.width = (done/total*100)+"%";
  $("left-progress").textContent = total + " items";
}

function refresh(){ renderTabs(); renderQuestions(curSec()); updateProgress(); syncBlanks(); }

function go(id){
  cur = id;
  const sec = curSec();
  location.hash = id;
  $("left-title").textContent = sec.title;
  $("left-sub").textContent = "Items " + sec.no;
  $("right-title").textContent = "Questions";
  $("right-sub").textContent = sec.theme;
  renderTabs();
  renderPassage(sec);
  renderQuestions(sec);
  updateProgress();
  $("passage").parentElement.parentElement.scrollTop = 0;
  $("questions").scrollTop = 0;
}

function jumpToQuestion(no){
  const el = $("questions").querySelector('.q-item[data-q="'+no+'"]');
  if(!el) return;
  el.scrollIntoView({block:"center"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

/* ===================== MARKER TOOLS ===================== */
function setTool(t){
  tool = t;
  if(["y","g","b","p"].indexOf(t)>=0) lastColor = t;
  document.querySelectorAll(".swatch").forEach(b=> b.classList.toggle("on", b.dataset.tool===t));
  document.querySelectorAll(".tool-btn[data-tool]").forEach(b=> b.classList.toggle("on", b.dataset.tool===t));
  document.body.classList.toggle("mark-on", ["y","g","b","p","u"].indexOf(t)>=0);
  document.body.classList.toggle("pen-on", t==="pen");
  document.body.classList.toggle("mark-erase", t==="erase");
  const box = $("passage");
  box.querySelectorAll(".mk").forEach(m=> m.classList.toggle("eraseable", t==="erase"));
  box.querySelectorAll(".sent").forEach(m=> m.classList.toggle("eraseable", t==="erase" && m.classList.contains("mk")));
  if(t!=="pen") finishStroke();
}
document.querySelectorAll(".swatch,.tool-btn[data-tool]").forEach(b=>{
  b.onclick = () => setTool(b.dataset.tool);
});

function persistPassage(){
  marks[cur] = $("passage").innerHTML;
  saveMarks();
}

function unwrap(node){
  const p = node.parentNode;
  while(node.firstChild) p.insertBefore(node.firstChild, node);
  p.removeChild(node);
  if(p.normalize) p.normalize();
}

/* --- mark the selected text --- */
function applyMark(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const box = $("passage");
  if(!box.contains(range.commonAncestorContainer)) return false;
  if(!sel.toString().trim()) return false;
  const span = document.createElement("span");
  span.className = "mk " + (tool==="u" ? "mk-u" : "mk-"+tool);
  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }catch(e){ return false; }
  sel.removeAllRanges();
  bindBlanks(); syncBlanks();
  persistPassage();
  return true;
}

/* --- click once: mark the whole sentence --- */
function toggleSentence(el){
  const cls = tool==="u" ? "mk-u" : "mk-"+tool;
  const had = el.classList.contains(cls);
  el.classList.remove("mk","mk-y","mk-g","mk-b","mk-p","mk-u");
  if(!had) el.classList.add("mk", cls);
  persistPassage();
}
function clearSentence(el){
  let changed = false;
  ["mk","mk-y","mk-g","mk-b","mk-p","mk-u"].forEach(c=>{ if(el.classList.contains(c)){ el.classList.remove(c); changed = true; } });
  if(changed) persistPassage();
}

document.addEventListener("mouseup", e=>{
  if(tool==="pen") return;
  const box = $("passage");

  if(tool==="erase"){
    if(!box.contains(e.target)) return;
    const t = e.target.closest ? e.target.closest(".mk") : null;
    const sent = e.target.closest ? e.target.closest(".sent") : null;
    if(t && t!==sent){ unwrap(t); persistPassage(); bindBlanks(); syncBlanks(); return; }
    if(sent && sent.classList.contains("mk")){ clearSentence(sent); return; }
    return;
  }
  if(["y","g","b","p","u"].indexOf(tool)<0) return;      // Off

  if(applyMark()) return;                                // dragged a selection
  if(!box.contains(e.target)) return;
  if(e.target.closest && e.target.closest(".blank")) return;  // blank -> jump to question
  const sent = e.target.closest ? e.target.closest(".sent") : null;
  if(sent && box.contains(sent)) toggleSentence(sent);   // single click -> whole sentence
});

/* ===================== FREEHAND PEN ===================== */
const ink = $("ink");
let stroke = null;

function resizeInk(){
  const w = $("passage-wrap");
  const ww = Math.max(w.offsetWidth, 1), hh = Math.max(w.offsetHeight, 1);
  ink.setAttribute("width", ww); ink.setAttribute("height", hh);
  ink.style.width = ww+"px"; ink.style.height = hh+"px";
}
const SVGNS = "http://www.w3.org/2000/svg";
function makeStroke(pts, c, w){
  w = w || 3;
  const g = document.createElementNS(SVGNS,"g");
  g.setAttribute("class","ink-g");
  const hit = document.createElementNS(SVGNS,"polyline");
  hit.setAttribute("class","ink-hit");
  hit.setAttribute("points", pts);
  hit.setAttribute("stroke-width", Math.max(16, w*4));
  const line = document.createElementNS(SVGNS,"polyline");
  line.setAttribute("class","ink-line");
  line.setAttribute("points", pts);
  line.setAttribute("stroke", c || "#e0523f");
  line.setAttribute("stroke-width", w);
  g.appendChild(hit); g.appendChild(line);
  return g;
}
function drawInk(){
  ink.innerHTML = "";
  (scribbles[cur] || []).forEach(s=> ink.appendChild(makeStroke(s.pts, s.c, s.w)));
}
function persistInk(){
  scribbles[cur] = Array.prototype.map.call(ink.querySelectorAll(".ink-line"),
    p=>({pts:p.getAttribute("points"), c:p.getAttribute("stroke"), w:p.getAttribute("stroke-width")}));
  saveInk();
}
function penColor(){ return PEN_INK[penC] || "#e0523f"; }

ink.addEventListener("pointerdown", e=>{
  if(tool!=="pen") return;
  e.preventDefault();
  const r = ink.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const g = makeStroke(x+","+y, penColor(), penW);
  ink.appendChild(g);
  stroke = {g:g, pts:x+","+y, x:x, y:y};
  try{ ink.setPointerCapture(e.pointerId); }catch(err){}
});
ink.addEventListener("pointermove", e=>{
  if(!stroke) return;
  const r = ink.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if(Math.abs(x-stroke.x) + Math.abs(y-stroke.y) < 2) return;
  stroke.x = x; stroke.y = y;
  stroke.pts += " " + x + "," + y;
  stroke.g.childNodes[0].setAttribute("points", stroke.pts);
  stroke.g.childNodes[1].setAttribute("points", stroke.pts);
});
function finishStroke(){
  if(!stroke) return;
  if(stroke.pts.trim().split(/\s+/).length < 2) stroke.g.remove();   // a stray dot, not a stroke
  stroke = null;
  persistInk();
}
window.addEventListener("pointerup", ()=>{ if(tool==="pen") finishStroke(); });

/* eraser also removes pen strokes */
ink.addEventListener("click", e=>{
  if(tool!=="erase") return;
  const g = e.target.closest ? e.target.closest(".ink-g") : null;
  if(g){ g.remove(); persistInk(); }
});

if(window.ResizeObserver){
  new ResizeObserver(()=>resizeInk()).observe($("passage-wrap"));
}

/* ===================== CLEAR / RESET ===================== */
$("clear-marks").onclick = () => {
  const n = $("passage").querySelectorAll(".mk").length;
  const k = ink.querySelectorAll(".ink-line").length;
  if(!n && !k){ alert("There are no marks or strokes in this passage yet."); return; }
  if(!confirm("Remove " + n + " mark(s) and " + k + " stroke(s) from this passage?")) return;
  delete marks[cur]; delete scribbles[cur];
  saveMarks(); saveInk();
  renderPassage(curSec());
};

$("reset").onclick = () => {
  const sec = curSec();
  if(!confirm("Clear all your answers for " + sec.title + "?")) return;
  sec.questions.forEach(q=>{ delete answers[q.no]; });
  save(); refresh();
};

document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ if(tool!=="off") setTool("off"); return; }
  if(/input|textarea/i.test(e.target.tagName)) return;
  const i = SECTIONS.findIndex(s=>s.id===cur);
  if(e.key==="ArrowRight" && i<SECTIONS.length-1) go(SECTIONS[i+1].id);
  if(e.key==="ArrowLeft" && i>0) go(SECTIONS[i-1].id);
});

/* name / class / score */
["f-name","f-class","f-score"].forEach(id=>{
  const v = localStorage.getItem(KEY+":"+id); if(v) $(id).value = v;
  $(id).addEventListener("input", ()=> localStorage.setItem(KEY+":"+id, $(id).value));
});

setFs(fs);
setTool(tool);
go(cur);
</script>
